[package]
name = "aozora2"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aozora Bunko format converter CLI"
readme = "../../README.en.md"
keywords = ["aozora", "bunko", "japanese", "text", "converter"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "aozora2"
path = "src/main.rs"

[lib]
name = "aozora2"
path = "src/lib.rs"

[dependencies]
# 交換形式（`ast` サブコマンド・`--from-ast`）に serde が要る。
aozora-core = { workspace = true, features = ["serde"] }
clap.workspace = true
encoding_rs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
