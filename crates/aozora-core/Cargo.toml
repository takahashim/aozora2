[package]
name = "aozora-core"
version = "0.7.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Aozora Bunko format processing"
readme = "README.en.md"
keywords = ["aozora", "bunko", "japanese", "text", "parser"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
once_cell.workspace = true
regex.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
zip.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[features]
# analysis の結果型を JSON 直列化可能にする（aozora_farm など GUI 側で有効化）。
serde = ["dep:serde"]

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
