name: GUI

on:
  push:
    branches: [main, master]
    paths:
      - "crates/aozora_farm/**"
      - "crates/aozora-core/**"
      - ".github/workflows/gui.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "crates/aozora_farm/**"
      - "crates/aozora-core/**"
      - ".github/workflows/gui.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: GUI build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/aozora_farm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/aozora_farm/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-

      - name: Install frontend dependencies
        run: npm ci

      # tauri build は beforeBuildCommand (tsc && vite build) を実行してから
      # src-tauri (aozora-core をリンク) をコンパイルする。--no-bundle により
      # インストーラ生成（Windows の .ico や署名が必要）はスキップし、
      # フロントエンド＋Rust アプリのビルド／リンク成立のみを検証する。
      - name: Build Tauri app (no bundle)
        run: npm run tauri -- build --no-bundle
