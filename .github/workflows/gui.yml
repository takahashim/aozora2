name: GUI

on:
  push:
    branches: [main, master]
    paths:
      - "crates/aozora_farm/**"
      - "crates/aozora-core/**"
      - ".github/workflows/gui.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "crates/aozora_farm/**"
      - "crates/aozora-core/**"
      - ".github/workflows/gui.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: GUI build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/aozora_farm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aozora_farm/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-

      - name: Install frontend dependencies
        run: npm ci

      # macOS: 署名なしで .dmg を生成する（icns 同梱）。生の .app を
      # upload-artifact に通すとバンドル権限/ad-hoc 署名が壊れ「壊れているため
      # 開けません」になるため、バンドルがそのまま保たれる .dmg のみ配布する。
      # （未署名・未公証なので利用側で xattr で検疫属性を外す必要がある。）
      - name: Build Tauri app (macOS, dmg)
        if: matrix.os == 'macos-latest'
        run: npm run tauri -- build --bundles dmg

      # Windows: NSIS インストーラ(.exe)を生成する。外字/CSS などの bundle.resources
      # を同梱するので単体で使える（生 exe＝--no-bundle だとリソースが付かず実用不可）。
      # NSIS は tauri が自動取得。icon.ico は本リポジトリに同梱済み。
      - name: Build Tauri app (Windows, NSIS installer)
        if: matrix.os == 'windows-latest'
        run: npm run tauri -- build --bundles nsis

      # 生成した Mac アプリ（.dmg のみ）をアーティファクトとして公開。ワークスペース
      # なので出力はリポジトリ直下 target/ に出る（保険で src-tauri 配下も glob）。
      # 利用手順: dmg をマウント→アプリを /Applications へ→
      #   xattr -dr com.apple.quarantine "/Applications/青空ファーム.app"
      - name: Upload macOS dmg
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aozora-farm-macos
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            crates/aozora_farm/src-tauri/target/release/bundle/dmg/*.dmg

      # 生成した Windows インストーラ(.exe)を公開。
      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aozora-farm-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            crates/aozora_farm/src-tauri/target/release/bundle/nsis/*.exe
